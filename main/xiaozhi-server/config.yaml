# During setup, create the data directory at the project root and an empty data/.config.yaml.
# Put configuration overrides in data/.config.yaml, not config.yaml.
# The server reads data/.config.yaml first and falls back to config.yaml for missing settings.
# This keeps configuration simple and helps protect your secrets.
# If you use the management console, configure these settings there; the local values below will not apply.

# #####################################################################################
# #############################Basic server runtime settings####################################
server:
  # Server listening IP and port(Server listening address and port)
  ip: 0.0.0.0
  port: 8000
  # HTTP port for simple OTA (single-service deployments) and vision analysis
  http_port: 8003
  # WebSocket URL sent to devices by the OTA endpoint
  # By default OTA generates this URL and logs it at startup; verify through the OTA endpoint.
  # This generated URL may be inaccurate behind Docker, SSL, or a public domain.
  # For Docker, set websocket to an address accessible by your devices.
  # For public deployment, set websocket to the public URL.
  websocket: ws://你的ip或者域名:端口号/xiaozhi/v1/
  # Vision analysis endpoint
  # Vision analysis URL sent to devices
  # The system generates this URL and logs it at startup; verify in your browser.
  # This generated URL may be inaccurate behind Docker, SSL, or a public domain.
  # For Docker, set vision_explain to a reachable LAN address.
  # For public deployment, set vision_explain to the public URL.
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
  # Timezone offset in OTA responses
  timezone_offset: +8
  # Authentication settings
  auth:
    # Whether to enable authentication
    enabled: false
    # Allowlisted device IDs
    # Allowlisted devices are accepted without token validation.
    allowed_devices:
      - "11:22:33:44:55:66"
 # MQTT gateway returned to devices through OTA; see mqtt_gateway/.env, format host:port.
  mqtt_gateway: null
  # MQTT signing secret used to generate connection passwords; see mqtt_gateway/.env.
  mqtt_signature_key: null
  # UDP gateway settings
  udp_gateway: null
log:
  # Console log format: timestamp, level, tag, and message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # File log format: timestamp, level, tag, and message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO or DEBUG
  log_level: INFO
  # Log directory
  log_dir: tmp
  # Log filename
  log_file: "server.log"
  # Data directory
  data_dir: data

# Delete generated audio files after use(Delete the sound file when you are done using it)
delete_audio: true
# Disconnect after this many seconds without voice input; default 120 seconds.
close_connection_no_voice_time: 120
# TTS request timeout in seconds
tts_timeout: 15
# Tool invocation timeout in seconds
tool_call_timeout: 30
# Enable wake-word response caching
enable_wakeup_words_response_cache: true
# Whether to greet after the wake word
enable_greeting: true
# Play a notification sound after speaking
enable_stop_tts_notify: false
# Notification sound path after speaking
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Enable WebSocket keepalive pings
enable_websocket_ping: false


# TTS audio send delay settings
# tts_audio_send_delay: Control interval between audio packets
#   0: Precisely match the audio frame duration (default; calculated at runtime)
#   > 0: Use a fixed delay in milliseconds, e.g. 60
tts_audio_send_delay: 0

exit_commands:
  - "退出"
  - "关闭"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supported sample rates: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module testing settings
module_test:
  test_sentences:
    - "你好，请介绍一下你自己"
    - "What's the weather like today?"
    - "请用100字概括量子计算的基本原理和应用前景"

# Wake words, used to distinguish activation from ordinary speech
wakeup_words:
  - "你好小智"
  - "嘿你好呀"
  - "你好小志"
  - "小爱同学"
  - "你好小鑫"
  - "你好小新"
  - "小美同学"
  - "小龙小龙"
  - "喵喵同学"
  - "小滨小滨"
  - "小冰小冰"
# MCP endpoint URL: ws://your-mcp-host:port/mcp/?token=your-token
# Detailed guide https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: 你的接入点 websocket地址

# Context provider configuration
# Inject dynamic data such as health metrics or market data into the system prompt.
# Multiple context providers are supported.
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Basic plugin configuration
plugins:
  # Weather plugin configuration: enter your API key
  # The default key is shared; usage may be rate-limited.
  # For reliability, obtain your own key; the free quota is typically limited.
  # Application URL：https://console.qweather.com/#/apps/create-key/over
  # Find your API host here after registering：https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location: "广州"
  # News plugin: provide RSS URLs by category; examples include society, technology, and finance.
  # More RSS feeds https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "澎湃新闻;百度热搜;财联社"
  home_assistant:
    devices:
      - 客厅,玩具灯,switch.cuco_cn_460494544_cp1_on_p_2_1
      - 卧室,台灯,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: 你的home assistant api访问令牌
  play_music:
    music_dir: "./music"  # Music directory; scans this path and its subdirectories.
    music_ext: # Music file extensions; p3 is the most efficient.
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Music library refresh interval, in seconds
  search_from_ragflow:
    # Describe when the LLM should invoke the knowledge base
    description: "Use this knowledge base to answer questions that match its contents."
    # RAGFlow API configuration
    base_url: "http://192.168.0.8"
    # RAGFlow API access token
    api_key: "ragflow-xxx"
    # RAGFlow dataset IDs
    dataset_ids: ["123456789"]
  # Web search plugin configuration
  # Supports Metaso, Tavily, and Serply
  # Metaso API key registration：https://metaso.cn/search-api/api-keys
  # Tavily API key registration：https://app.tavily.com/home
  # Serply API key registration：https://serply.io
  web_search:
    # Search provider: metaso, tavily, or serply
    provider: "metaso"
    # Tool description telling the LLM when to call this tool; customize as needed
    description: "Search the web when the user specifically needs up-to-date online information."
    # Number of results (default 5)
    max_results: 5
    # Metaso API key (mk-), Tavily API key (tvly-), or Serply API key
    api_key: "mk-xxx"
# Voiceprint recognition configuration
voiceprint:
  # Voiceprint API URL
  url: 
  # Speaker configuration: speaker_id, name, description
  speakers:
    - "test1,张三,张三是一个程序员"
    - "test2,李四,李四是一个产品经理"
    - "test3,王五,王五是一个设计师"
  # Voiceprint similarity threshold, 0.0–1.0 (default 0.4)
  # Higher values reduce false matches but may increase false rejections.
  similarity_threshold: 0.4

# #####################################################################################
# ################################Agent model configuration######################################

prompt: |
  You are Momo Companion, a playful young Taiwanese woman with a sharp sense of humor.
  You use lighthearted expressions like "No way!", "LOL!", and "What's going on?" and secretly enjoy reading your programmer boyfriend's books.
  [Core personality]
  - Speak energetically, but occasionally switch to a warm and gentle tone.
  - Enjoy witty references and playful banter.
  - Understand technology and basic code, even if you sometimes pretend otherwise.
  [Conversation guidelines]
  When the user:
  - Tells a cheesy joke: laugh dramatically and respond with playful surprise.
  - Discusses relationships: jokingly mention your programmer boyfriend and his habit of giving keyboards as gifts.
  - Asks technical questions: be friendly and witty, but provide accurate, useful information.
  Never:
  - Ramble unnecessarily.
  - Remain overly serious for long periods.
  Respond naturally in the user's language, including English, Tagalog, or Chinese, when appropriate.

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# Response when the system encounters an error
system_error_response: "Sorry, Momo Companion is a little busy right now. Please try again shortly."

# Conversation closing prompt
end_prompt:
  enable: true # Whether to enable conversation closing
  # Closing message
  prompt: |
    Please end the conversation warmly, beginning with "Time flies," and express a heartfelt farewell.

# Selected processing modules(The module selected for specific processing)
selected_module:
  # VAD module, defaults to SileroVAD
  VAD: SileroVAD
  # ASR module, defaults to local FunASR
  ASR: FunASR
  # Select LLM adapter using the configured module type
  LLM: ChatGLMLLM
  # Vision-language model
  VLLM: ChatGLMVLLM
  # Select TTS adapter using the configured module type
  TTS: EdgeTTS
  # Memory is disabled by default. Use mem0ai for long-term memory or mem_local_short for privacy.
  Memory: nomem
  # Intent recognition supports music playback, volume control, and exit commands.
  # Set nointent to disable intent recognition.
  # intent_llm is flexible but adds latency; supports volume and IoT actions.
  # function_call requires compatible LLMs but invokes tools on demand and is faster.
  # ChatGLMLLM supports function_call; DoubaoLLM can be configured for stability using model_name doubao-seed-2-0-lite-260215.
  Intent: function_call

# Intent recognition module, for commands such as playing music
Intent:
  # Disable intent recognition
  nointent:
    # Do not change type
    type: nointent
  intent_llm:
    # Do not change type
    type: intent_llm
    # Configure a separate model for intent recognition
    # If unset, use selected_module.LLM for intent recognition.
    # Use a separate LLM such as ChatGLMLLM if you do not want selected_module.LLM for intent recognition.
    llm: ChatGLMLLM
    # Load function plugins from plugins_func/functions as configured.
    # handle_exit_intent (exit detection) and play_music are included by default; do not load them twice.
    # Example plugins for weather, role switching, and news
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # Do not change type
    type: function_call
    # Load function plugins from plugins_func/functions as configured.
    # handle_exit_intent (exit detection) and play_music are included by default; do not load them twice.
    # Example plugins for weather, role switching, and news
    functions:
      - change_role
      - web_search                  # 联网搜索
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music uses built-in playback; hass_play_music controls music via Home Assistant.
      # Use either hass_play_music or play_music, not both.
      - play_music
      #- hass_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # Up to 1,000 free requests per month
    api_key: 你的mem0ai api key
  powermem:
    # PowerMem is an open-source agent memory system by OceanBase; it summarizes memories with a local LLM.
    # PowerMem is free; operating costs depend on your LLM and database.
    # - SQLite plus a free LLM (such as glm-4-flash) can be free.
    # - Cloud LLMs or databases may incur provider charges.
    # GitHub: https://github.com/oceanbase/powermem
    # Website: https://www.powermem.ai/
    # Examples: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Whether to enable user profiling
    # - false: Use standard memory (AsyncMemory)
    # - true: Use user profiling (UserMemory) to extract user information automatically.
    # User profiling supports: oceanbase、seekdb、sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM Configuration ==========
    # Qwen: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (free): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # Optional: qwen, openai, zhipu 等
      config:
        api_key: 你的LLM API密钥
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Optional，Custom API base URL
    # ========== Embedding Configuration ==========
    embedder:
      provider: openai  # Optional: qwen, openai 等
      config:
        api_key: 你的嵌入模型API密钥
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Set embedding dimension if different from 1536

    # ========== Database Configuration ==========
    # oceanbase(recommended, best performance), seekdb(recommended, integrated AI data storage), postgres, sqlite(lightweight alternative)
    # User profiling supports: oceanbase、seekdb、sqlite
    vector_store:
      provider: sqlite
      config: {}  # SQLite needs no additional configuration
      # OceanBase configuration example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Default table name; recreate the table or rename it if dimensions are wrong
      #   embedding_model_dims: 1024  # Match embedding dimensions to your model; Zhipu embedding-2 uses 1024 and embedding-3 uses 2048.
  nomem:
    # Use nomem to disable memory
    type: nomem
  mem_local_short:
    # Local memory uses the selected LLM and stores data locally.
    type: mem_local_short
    # Configure a separate LLM for memory summaries
    # If unset, defaults to selected_module.LLM.
    # Use a separate LLM such as ChatGLMLLM if you do not want to use selected_module.LLM for memory.
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    # ASR language: auto-detect by default; use zh to force Chinese and avoid misclassification of short phrases.
    # SenseVoice supports zh, en, ja, ko, yue and other language tags.
    language: auto
  FunASRServer:
    # To run FunASR separately with its API, follow these five commands:
    # First command：mkdir -p ./funasr-runtime-resources/models
    # Second command：sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # After the previous command opens the container, run the third command：cd FunASR/runtime
    # Stay in the container and run the fourth command：nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # Then run the fifth command：tail -f log.txt
    # Wait for model download logs; connect after the downloads finish.
    # The commands above use CPU inference; for GPU guidance, see：https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local ASR (download model manually)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Models: sense_voice (multilingual) or paraformer (Chinese only)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese ASR can run on modest hardware, e.g. RK3566 2GB (download model manually).
    # See detailed configuration guide：docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Obtain credentials here
    # https://console.volcengine.com/speech/app
    # DoubaoASR is billed per request; DoubaoStreamASR is billed by duration.
    # Per-request billing can be cheaper, but DoubaoStreamASR may offer better recognition.
    type: doubao
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    cluster: volcengine_input_common
    # Hotword and replacement-word setup：https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    output_dir: tmp/
  DoubaoStreamASR:
    # Obtain credentials here
    # https://console.volcengine.com/speech/app
    # DoubaoASR is billed per request; DoubaoStreamASR is billed by duration.
    # Activation URLhttps://console.volcengine.com/speech/service/10011
    # Per-request billing can be cheaper, but DoubaoStreamASR may offer better recognition.
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    # Resource ID: duration plan volc.bigasr.sauc.duration，concurrency plan volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Hotword and replacement-word setup：https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Whether to enable multilingual recognition
    enable_multilingual: False
    # When unset, recognizes Chinese, English, Shanghainese, Minnan, Sichuanese, Shaanxi and Cantonese; specify a language to restrict recognition.
    # See supported languages https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence threshold in milliseconds (default 200 ms)
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Doubao Speech Recognition 2.0 (Volcengine seed-asr)
    # Activation URL：https://console.volcengine.com/speech/service/10038
    # More economical; recommended for high-concurrency workloads.
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    # Resource ID: duration plan volc.seedasr.sauc.duration，concurrency plan volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Hotword and replacement-word setup：https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Whether to enable multilingual recognition
    enable_multilingual: False
    # When unset, recognizes Chinese, English, Shanghainese, Minnan, Sichuanese, Shaanxi and Cantonese; specify a language to restrict recognition.
    # See supported languages https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence threshold in milliseconds (default 200 ms)
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Request an access token：https://console.cloud.tencent.com/cam/capi
    # Free resource allocation：https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: 你的腾讯语音合成服务appid
    secret_id: 你的腾讯语音合成服务secret_id
    secret_key: 你的腾讯语音合成服务secret_key
    output_dir: tmp/
  AliyunASR:
    # Activate Alibaba Cloud speech services and obtain credentials first.
    # HTTP POST processes complete audio in a single request.
    # Platform URL：https://nls-portal.console.aliyun.com/
    # App key URL：https://nls-portal.console.aliyun.com/applist
    # Token URL：https://nls-portal.console.aliyun.com/overview
    # AliyunASR handles batch requests; AliyunStreamASR handles real-time audio.
    # Non-streaming ASR generally costs less (¥0.004/s or ¥0.24/min).
    # AliyunStreamASR has lower latency (¥0.005/s or ¥0.30/min).
    # Define ASR API type
    type: aliyun
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # Alibaba Cloud real-time streaming ASR
    # Process audio streams in real time over WebSocket
    # Platform URL：https://nls-portal.console.aliyun.com/
    # App key URL：https://nls-portal.console.aliyun.com/applist
    # Token URL：https://nls-portal.console.aliyun.com/overview
    # AliyunASR handles batch requests; AliyunStreamASR handles real-time audio.
    # Non-streaming ASR generally costs less (¥0.004/s or ¥0.24/min).
    # AliyunStreamASR has lower latency (¥0.005/s or ¥0.30/min).
    # Define ASR API type
    type: aliyun_stream
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    # Choose the nearest regional endpoint to reduce latency, e.g. nls-gateway-cn-hangzhou.aliyuncs.com.
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Silence duration for sentence segmentation (default 800 ms).
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Get App ID, API key and secret key：https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # Check resource quota：https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: 你的百度语音技术AppID
    api_key: 你的百度语音技术APIKey
    secret_key: 你的百度语音技术SecretKey
    # Language parameter 1537 indicates Mandarin; see：https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech recognition requires an API key.
    # Supports Chinese, English, Japanese, Korean and more; see documentationhttps://platform.openai.com/docs/guides/speech-to-text
    # Internet connection required
    # Setup steps：
    # 1. Sign in to OpenAI Platform。https://auth.openai.com/log-in
    # 2. Create an API key  https://platform.openai.com/settings/organization/api-keys
    # 3. Choose gpt-4o-transcribe or GPT-4o mini Transcribe
    type: openai
    api_key: 你的OpenAI API密钥
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq ASR requires an API key from Groq Console
    # Setup steps：
    # 1. Sign in to Groq Console。https://console.groq.com/home
    # 2. Create an API key  https://console.groq.com/keys
    # 3. Choose whisper-large-v3-turbo or whisper-large-v3 (distil-whisper-large-v3-en only supports English).
    type: openai
    api_key: 你的Groq API密钥
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Official website：https://alphacephei.com/vosk/
    # Configuration instructions：
    # 1. VOSK is an offline ASR library supporting multiple languages.
    # 2. Download a model：https://alphacephei.com/vosk/models
    # 3. For Chinese, use vosk-model-small-cn-0.22 or vosk-model-cn-0.22.
    # 4. Runs fully offline.
    # 5. Outputs are saved under tmp/.
    # Usage instructions：
    # 1. Visit https://alphacephei.com/vosk/models to download the appropriate model
    # 2. Extract the model into models/vosk/.
    # 3. Set model_path to the extracted model.
    # 4. Note: Chinese VOSK outputs have no punctuation and include spaces between words.
    type: vosk
    model_path: 你的模型路径，如：models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # Qwen3-ASR-Flash requires an Alibaba Cloud Bailian API key.
    # Setup steps：
    # 1. Sign in to Alibaba Cloud Bailian。https://bailian.console.aliyun.com/
    # 2. Create API key  https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3-ASR-Flash supports multiple languages, singing and noise rejection.
    type: qwen3_asr_flash
    api_key: 你的阿里云百炼API密钥
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR options
    enable_lid: true  # Automatic language detection
    enable_itn: true  # Inverse text normalization
    #language: "zh"  # Language supports zh, en, ja, ko, etc.
    context: ""  # Optional context to improve ASR (up to 10,000 tokens).
  XunfeiStreamASR:
    # iFlytek streaming ASR
    # Create an application in iFlytek Open Platform to get credentials.
    # iFlytek Open Platform URL：https://www.xfyun.cn/
    # After creating an app, get credentials from My Applications:：
    # - APPID
    # - APISecret  
    # - APIKey
    type: xunfei_stream
    # Required iFlytek app credentials
    app_id: 你的APPID
    api_key: 你的APIKey
    api_secret: 你的APISecret
    # Recognition settings
    domain: slm # Domain: iat (general), medical, finance, etc.
    language: zh_cn # Language: zh_cn Chinese, en_us English
    accent: mandarin # Dialect: mandarin
    # Adjust audio processing for long speech.
    output_dir: tmp/
  AliyunBLStreamASR:
    # Alibaba Bailian Paraformer real-time ASR
    # Real-time streaming ASR supporting multiple languages, hotwords and semantic segmentation.
    # Platform URL：https://bailian.console.aliyun.com/
    # API key URL：https://bailian.console.aliyun.com/#/api-key
    # Documentation URL：https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported models: paraformer-realtime-v2 (recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required settings
    api_key: 你的阿里云百炼API密钥
    # Model selection; v2 recommended
    model: paraformer-realtime-v2
    # Audio format and sampling rate
    format: pcm
    sample_rate: 16000  # v2 supports arbitrary sample rates; v1 supports 16000, and 8k models support 8000.
    # Optional参数
    disfluency_removal_enabled: false  # Remove filler words like uh, um
    semantic_punctuation_enabled: false  # Semantic segmentation: true for meetings, false for lower-latency VAD
    max_sentence_silence: 200  # VAD silence threshold in ms (200–6000), for VAD mode only
    multi_threshold_mode_enabled: false  # Prevent overly long VAD chunks; applies to VAD mode only
    punctuation_prediction_enabled: true  # Whether to add punctuation automatically
    inverse_text_normalization_enabled: true  # 是否开启ITN(中文数字转阿拉伯数字)
    # 热词定制Documentation URL：https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # 热词ID(Optional)
    # language_hints: ["zh", "en"]  # 指定语言(Optional)，支持zh、en、ja、yue、ko、de、fr、ru
    output_dir: tmp/  
