# For a lightweight xiaozhi-server deployment using local configuration only, you can ignore this file.
# If you want to load configuration from manager-api, follow these steps:
# Copy this file to xiaozhi-server/data/.config.yaml (create the data directory if needed).
# If data/.config.yaml already exists, remove the old copy first.
# Start manager-api and manager-web, then register an account. The first account becomes administrator.
# As administrator, open Parameter Management and locate server.secret. Copy its value; it changes with each fresh deployment.
# Edit data/.config.yaml and set manager-api.secret to the copied server.secret value.
server:
  ip: 0.0.0.0
  port: 8000
  # HTTP port used by the vision analysis interface
  http_port: 8003
  # Vision analysis endpoint
  # Vision analysis URL sent to devices
  # The server normally generates this URL and logs it at startup; open it in a browser to verify.
  # The generated URL may be inaccurate behind Docker, SSL or a public domain.
  # For Docker, set vision_explain to the accessible LAN URL.
  # For public deployments, use the externally accessible URL.
  vision_explain: http://your-host-or-domain:port/mcp/vision/explain
manager-api:
  # Manager API URL; prefer a LAN IP.
  # For Docker, use http://xiaozhi-esp32-server-web:8002/xiaozhi
  url: http://127.0.0.1:8002/xiaozhi
  # Manager API token: the copied server.secret.
  secret: your-server-secret
# Default system prompt template file
prompt_template: agent-base-prompt.txt